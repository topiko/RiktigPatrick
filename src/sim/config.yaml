# RL Training Configuration

# Architecture: Separate encoders for policy and value (no shared weights)
# - Policy encoder: 7 → 32 → 16 (Tanh)
# - Value encoder: 7 → 64 → 32 → 16 (Tanh, larger capacity)
# This prevents value function from being constrained by policy representation

training:
  nrollouts: 32
  max_episodes: 20001
  save_frequency: 10
  seed: 42

rl:
  learning_rate: 0.001
  value_learning_rate: 0.001
  gamma: 0.99
  entropy_scale: 0.01
  value_loss_scale: 1.0
  grad_clip: 10.0
  normalize_returns: true
  use_baseline: true
  init2zeros: false
  load_net: false

env:
  ctrl_mode: "vel"
  lock_head: true
  step_time: 0.01
  randomize: false

action:
  max_wheel_vel: 5.0  # rev/s (5 Hz)

reward:
  step: 1.0
  pitch_coef: 0.05
  action_coef: 0.0001
  yaw_coef: 0.01

model:
  model_input:
    - "filter/rp_pitch"
    - "sens/gyro"
    - "sens/left_wheel_vel"
    - "sens/right_wheel_vel"
    - "env/time"
  # Fixed normalization scales (divide by these)
  obs_scales:
    filter/rp_pitch: 20.0  # deg (±20 deg range)
    sens/gyro: 600.0  # deg/s (±600 deg/s range)
    sens/left_wheel_vel: 5.0  # rev/s (max wheel vel)
    sens/right_wheel_vel: 5.0  # rev/s (max wheel vel)
    env/time: 10.0  # seconds (time constant for normalization)

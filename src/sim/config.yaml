# RL Training Configuration

training:
  nrollouts: 32
  max_episodes: 20001
  save_frequency: 10
  seed: 42

rl:
  learning_rate: 0.0002
  gamma: 0.99
  entropy_scale: 0.01
  use_baseline: true
  init2zeros: false
  load_net: false

env:
  ctrl_mode: "vel"
  lock_head: true
  step_time: 0.01
  randomize: false

action:
  max_wheel_vel: 31.4159  # rad/s (5 Hz * 2π)

reward:
  step: 1.0
  pitch_coef: 0.05
  action_coef: 0.0001
  yaw_coef: 0.01

model:
  model_input:
    - "filter/rp_pitch"
    - "sens/gyro"
    - "sens/left_wheel_vel"
    - "sens/right_wheel_vel"
    - "env/time"
  # Fixed normalization scales (divide by these)
  obs_scales:
    filter/rp_pitch: 20.0  # deg (±20 deg range)
    sens/gyro: 10.0  # rad/s (±10 rad/s range)
    sens/left_wheel_vel: 31.4  # rad/s (max wheel vel)
    sens/right_wheel_vel: 31.4  # rad/s (max wheel vel)
    env/time: 10.0  # seconds (time constant for normalization)

[project]
name = "riktigpatrick"
version = "0.1.0"
description = "Balancing robot with RL control"
requires-python = ">=3.12"
dependencies = [
    "gymnasium[other]>=1.1",
    "mujoco",
    "dm-control",
    "torch",
    "numpy",
    "mlflow>=3",
    "pandas",
    "pyyaml",
    "matplotlib>=3.10.8",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["controller", "filters", "nn_ctrl", "relay", "riktigpatric", "sim", "sim.*"]

[tool.ty.src]
exclude = ["archive"]

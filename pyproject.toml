[project]
name = "riktigpatrick"
version = "0.1.0"
description = "Balancing robot with RL control"
requires-python = ">=3.12"
dependencies = [
    "gymnasium[other]",
    "mujoco",
    "dm-control",
    "torch",
    "numpy",
    "mlflow",
    "pandas",
    "pyyaml",
    "matplotlib>=3.10.8",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

defaults:
  - _self_

seed: 42

logging:
  mlflow:
    experiment_name: "rp_training"
    enabled: false

  plot_freq: 10  # Generate plots every N iterations

rl:
  gamma: 0.99
  entropy_scale: 0.01
  value_loss_scale: 1.0
  normalize_returns: true
  use_baseline: true
  init2zeros: false
  load_net: false
  trim_end_steps: 0

reward:
  step: 0.0
  pitch_coef: 1.0
  action_coef: 0.0
  yaw_coef: 0.03
  termination_penalty: 0.0

train:
  policy_lr: 0.001
  value_lr: 0.03
  grad_clip: 10.0

env:
  step_time: 0.01  # seconds
  randomize: false
  n_parallel: 5
  # All units are SI (International System of Units)
  max_wheel_vel: 10.0  # rad/s - maximum wheel velocity
  max_wheel_acc: 50.0  # rad/s² - maximum wheel acceleration

policy:
  actions:
    - act/accelerate_both_wheels:
        type: discrete
        bins: [-50, -25, 0, 25, 50]  # rad/s² - acceleration values for both wheels

    - act/head_pitch_vel:
        type: discrete
        bins: [-0.2, -0.1, 0, 0.1, 0.2]  # rad/s - head pitch velocity

  inputs:
    - filter/rp_pitch
    - sens/left_wheel_vel
    - sens/right_wheel_vel
    - env/obs_time
    - sens/gyro



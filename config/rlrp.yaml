defaults:
  - _self_

seed: 42

logging:
  mlflow:
    experiment_name: "rp_training"
    enabled: false
    push_freq: 10

  plot_freq: 100  # Generate plots/videos every N iterations; 0 disables both
  save_freq: 1000

rl:
  discount: 0.99
  value_loss_coef: 0.1  # limit critic influence on the shared recurrent features

reward:
  # These keys need to exactly match the values in patrick/Observables
  reward/step: 1.0
  reward/rp_pitch: -5.73  # per radian; approximately the old -0.1 per degree
  reward/fell: 0.0
  reward/wheel_vel: -0.2
  reward/head_pitch: -0.5
  reward/camera_pitch: -0.5  # true world elevation error, active with head_tracking
  reward/head_yaw: -0.25  # neck-relative yaw error
  reward/pos: -1.0  # penalty per meter of absolute position error
  reward/vel: -4.0  # penalty per m/s of absolute velocity error
  reward/yaw_rate: -1.0  # penalty per rad/s of body-Z angular-rate error
  reward/total: 1.0

train:
  device: auto  # auto selects CUDA when available; cpu, cuda, or cuda:N also supported
  policy_lr: 0.0003
  grad_clip: 500.0
  tbptt_steps: 32  # detach recurrent gradient history every N rollout steps
  max_iterations: null  # null trains until interrupted
  resume_from: null  # full local/MLflow-downloaded .pt checkpoint (weights + Adam + RNG)
  resume_lr: null  # optional explicit Adam LR override after loading a checkpoint
  kl_probe_every: 32  # sample conditional before/after policy KL; 0 disables diagnostics
  target_positions: null  # optional list of n_parallel fixed targets, in meters
  target_trajectories: null  # optional per-env lists of [time, position] waypoints
  target_velocities: null  # optional list of n_parallel velocity commands, in m/s
  target_yaw_rates: null  # optional list of n_parallel body-Z rate commands, rad/s
  head_targets: null  # optional per-env [world camera elevation, neck yaw], rad
  head_trajectories: null  # optional per-env [time, elevation, yaw] waypoints

checkpoints:
  dir: ${hydra:runtime.output_dir}/checkpoints
  every: 100  # archive periodic checkpoints, independently of MLflow model logging

curriculum:
  enabled: true  # balance -> hold_position -> locomotion -> full_control
  neutral_probability: 0.9  # discrete-head activation; continuous heads use their initial_std
  consecutive_passes: 3  # strict gates after the balance warm-up
  survival_fraction: 0.9
  balance_seconds: 3.0
  balance_survival_fraction: 0.8
  balance_consecutive_passes: 1
  hold_seconds: 20.0
  position_mae: 0.05  # meters from the starting position
  hold_velocity_weight: 0.125  # multiply reward/vel for gentle damping during position hold
  locomotion_seconds: 20.0
  startup_seconds: 1.0  # tracking-error allowance at episode start
  velocity_mae: 0.05  # m/s
  yaw_rate_mae: 0.2  # rad/s
  pitch_deadband: 0.08726646259971647  # 5 degrees in radians; all curriculum stages
  forward_velocities: [-0.1, 0.0, 0.1]
  yaw_rates: [-0.5, 0.0, 0.5]

guard:
  enabled: true
  compare_deterministic: false  # optional paired diagnostic; gates still use sampled actions
  every: 25  # shared guard/curriculum evaluation interval; initial evaluation sets baseline
  episodes: 20  # fixed validation batch; covers all curriculum command pairs
  seed: 1042
  drop_fraction: 0.25  # rollback after a drop larger than both this fraction and absolute_drop
  absolute_drop: 25.0
  patience: 1  # consecutive degraded validation checks
  min_best_return: 200.0  # do not constrain noisy initial learning
  lr_factor: 0.95
  min_lr: 0.000001

env:
  step_time: 0.01  # seconds
  step_time_std: 0.0  # 0 disables jitter; use 0.002 for approximately 2 ms std
  min_step_time: 0.007  # lower jitter bound; rounded upward to the 2 ms physics grid
  randomize: true  # vary initial pitch and physical parameters during training
  n_parallel: 16
  max_episode_time: 20.0  # seconds, independent of how many policy updates occur
  max_episode_steps: null  # optional legacy duration cap: steps * nominal step_time
  arena_half_size: 20.0  # visual floor extent in meters; plane collisions are infinite
  tracking_mode: velocity  # velocity, position, position_velocity, or none
  target_pos: 0.0  # default fixed position target, meters from episode origin
  target_trajectory: null  # optional default trajectory for training and evaluation
  target_vel: 0.0  # default low-level command: balance and stop, m/s
  yaw_tracking: true
  target_yaw_rate: 0.0  # rad/s about body +Z; positive turns left
  head_tracking: true
  head_target: [0.0, 0.0]  # horizontal gaze, forward neck-relative yaw, radians
  head_trajectory: null
  pitch_deadband: null  # null: linear pitch cost; radians: quadratic outside free region
  camera_view: both  # external, head, or both (overview left, head camera right)

  # Relative standard deviation of body/head masses and wheel diameter
  random_scale: 0.01

  # All units are SI (International System of Units)
  max_wheel_vel: 10.0  # rad/s - maximum wheel velocity
  max_wheel_acc: 500.0  # rad/s² - maximum wheel acceleration
  max_head_vel: 1.0  # rad/s; prototype hardware speed has not been measured

policy:
  hsize: 64
  n_rnnlayers: 1
  restore_id: null #m-29426a56db26487faa3adad22b42489a
  actions:
    act/accelerate_both_wheels:
      type: discrete
      bins: [-150, -100, -75, -50, -25, -10, -5, -2, 0, 2, 5, 10, 25, 50, 75, 100, 150]  # rad/s² - acceleration values for both wheels

    act/wheel_vel_diff:
      type: discrete
      bins: [-4.0, -2.0, -1.0, -0.5, 0.0, 0.5, 1.0, 2.0, 4.0]  # right minus left wheel rad/s; positive turns left

    act/head_pitch_vel:
      type: discrete
      bins: [-1.0, -0.5, -0.2, 0, 0.2, 0.5, 1.0]  # positive looks up, rad/s

    act/head_turn_vel:
      type: discrete
      bins: [-1.0, -0.5, -0.2, 0, 0.2, 0.5, 1.0]  # positive turns left, rad/s

  # Shared sensor inputs; the trainer appends the selected tracking-mode inputs.
  inputs:
    - filter/rp_pitch
    - sens/left_wheel_vel
    - sens/right_wheel_vel
    - sens/head_pitch
    - sens/head_turn
    - env/obs_time
    - sens/gyro
    - sens/acc

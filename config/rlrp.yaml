defaults:
  - _self_


training:
  nrollouts: 64
  max_episodes: 20001
  save_frequency: 10
  seed: 42

rl:
  gamma: 0.99
  entropy_scale: 0.01
  value_loss_scale: 1.0
  normalize_returns: true
  use_baseline: true
  init2zeros: false
  load_net: false
  trim_end_steps: 0

train:
  policy_lr: 0.001
  value_lr: 0.03
  n_epochs: 10
  grad_clip: 10.0

env:
  step_time: 0.01  # seconds
  randomize: false
  n_parallel: 5
  # All units are SI (International System of Units)
  max_wheel_vel: 10.0  # rad/s - maximum wheel velocity
  max_wheel_acc: 50.0  # rad/s² - maximum wheel acceleration

policy:
  actions:
    - act/accelerate_both_wheels

  act_map:
    act/accelerate_both_wheels: 3

  inputs:
    - filter/rp_pitch
    - sens/left_wheel_vel
    - sens/right_wheel_vel
    - env/obs_time

reward:
  step: 0.0
  pitch_coef: 1.0
  action_coef: 0.0
  yaw_coef: 0.03
  termination_penalty: 0.0

model:
  model_input:
    - "filter/rp_pitch"
    - "sens/gyro"
    - "sens/left_wheel_vel"
    - "sens/right_wheel_vel"
    - "env/action_time"

